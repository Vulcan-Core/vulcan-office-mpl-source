apply plugin: 'com.android.library'

// buildhost settings - paths and the like
apply from: 'libSettings.gradle'

layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("lib"))

// -PvulcanAssetsOut=<dir> moves every generated asset OUT of the AAR.
//
// Upstream writes the engine payload (program/, share/, unpack/, templates/,
// etc/, and the COOL browser dist/) into this module's own asset source dirs,
// so `assembleRelease` produces a ~209 MB AAR: ~130 MB of that is data the
// Android app must ship in an install-time asset pack instead, because
// LibreOffice resolves /assets/... through the AAssetManager of ONE apk (the
// apkFile handed to cokit_initialize) and native libs cannot live in a pack.
// Splitting the two is therefore a packaging requirement, not an optimisation.
//
// When the property is set, the same tasks write the same tree into that one
// directory (main/ and release/ asset roots both redirect there, matching how
// AGP merges them into the AAR's assets/), and the AAR carries classes plus
// jni/<abi>/*.so only. When it is absent every path below is byte-for-byte
// upstream's.
def vulcanAssetsOut = project.findProperty('vulcanAssetsOut')
// `-PvulcanAssetsOut` with no value, or `=`, or whitespace, is a MISTAKE and not
// a request for upstream behaviour. Groovy truthiness makes '' falsy, so the
// property used to fall back silently to the in-tree asset roots: the build
// succeeded, the AAR came out with 137 MB of assets/ in it, and the caller's
// --out/assets directory stayed empty. build-online-android.sh's own guard would
// catch that one case, but every other caller (a developer, another script)
// would just get the wrong AAR. Fail where the mistake was made.
if (vulcanAssetsOut != null && vulcanAssetsOut.toString().trim().isEmpty()) {
	throw new GradleException("vulcanAssetsOut must be a path")
}
// Resolved against the project dir when relative, like every other path here.
def vulcanAssetsDir = vulcanAssetsOut ? file(vulcanAssetsOut.toString().trim()) : null
def assetsMain    = vulcanAssetsDir ?: file('src/main/assets')
def assetsDebug   = vulcanAssetsDir ?: file('src/debug/assets')
def assetsRelease = vulcanAssetsDir ?: file('src/release/assets')
if (vulcanAssetsDir != null) {
    logger.lifecycle("vulcanAssetsOut: engine assets -> ${vulcanAssetsDir} (AAR gets classes + jni/ only)")
}

android {
    namespace 'org.libreoffice.androidlib'
    compileSdk 36
    ndkVersion "28.2.13676358"
    buildFeatures.buildConfig = true

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        resValue "string", "app_name", "${liboAppName}"
        buildConfigField "String", "GIT_COMMIT", "\"${liboOVersionHash}\""
        buildConfigField "boolean", "GOOGLE_PLAY_ENABLED", "${liboGooglePlay}"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STL=c++_shared"
            }
        }
    }

    splits {
        abi {
            enable true

            reset ()
            for (abi in liboAbiSplit) {
                //noinspection ChromeOsAbiSupport - we generate liboAbiSplit at configure time, so we won't include ChromeOS support if we're not trying to build for it...
                include(abi)
            }
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "${liboAppName} Debug"
            debuggable true
        }
        release {
            minifyEnabled false // FIXME disabled before we get a good proguardRules for callFakeWebsocketOnMessage calling from C++
            shrinkResources false // FIXME cannot be enabled when minifyEnabled is turned off
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // let gradle pack the shared library into apk
            jniLibs.srcDirs = ['src/main/cpp/lib']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            buildStagingDirectory "${rootProject.layout.buildDirectory.get()}/cmake"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // https://stackoverflow.com/questions/75263047/duplicate-class-in-kotlin-android
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}

tasks.register('copyUnpackAssets', Copy) {
    description "copies assets that need to be extracted on the device"
    into new File(assetsMain, 'unpack')
    into('program') {
        from("${liboInstdir}/program/types") {
            includes = [
                    "offapi.rdb",
                    "oovbaapi.rdb"
            ]
        }
        from("${liboInstdir}/program") {
            includes = ["types.rdb"]
            rename 'types.rdb', 'udkapi.rdb'
        }

        into('resource') {
            from "${liboInstdir}/program/resource"
            includes = ['**']
        }
    }
    into('etc/coolwsd') {
        from('/android/coolkitconfig.xcu')
        includes = ['coolkitconfig.xcu']
    }
    into('user/fonts') {
        from "${liboInstdir}/share/fonts/truetype"
        // Note: restrict list of fonts due to size considerations - no technical reason anymore
        // ToDo: fonts would be good candidate for using Expansion Files instead
        includes = [
                "EmojiOne*.ttf",
                "Liberation*.ttf",
                "Caladea-*.ttf",
                "Carlito-*.ttf",
                "Gen*.ttf",
                "opens___.ttf"
        ]
    }
    into('etc/fonts') {
        from "${liboSrcRoot}/android/source/"
        includes = ['fonts.conf']
        doFirst {
            // we have changed the filter below; so to always re-generate this
            // file, delete it first - no idea how to set a dependency on
            // build.gradle changes :-(
            file('fonts.conf').delete()
        }
        filter {
            String line ->
                line.replaceAll(
                        '@@APPLICATION_ID@@', new String("${liboApplicationId}")
                )
        }
    }
    into('share') {
        from "${liboInstdir}/share"
        // liblangtag data is needed for locales like en-CH
        include 'liblangtag/**'
    }

    into('share') {
        from "${liboInstdir}/share"
        // extensions - for the dictionaries for hunspell
        includes = ['extensions/dict-de/**', 'extensions/dict-en/**', 'extensions/dict-es/**', 'extensions/dict-fr/**', 'extensions/dict-pt-BR/**']
        exclude { FileTreeElement details ->
            !(details.file.isDirectory() ||
                    details.file.name.endsWith('.xcu') ||
                    details.file.name.endsWith('.dic') ||
                    details.file.name.endsWith('.aff') ||
                    details.file.name.endsWith('.xml'))
        }
    }
}

tasks.register('copyAssets', Copy) {
    description "copies assets that can be accessed within the installed apk"
    into assetsMain
    from("${liboSrcRoot}/instdir/") {
        includes = ["LICENSE.html", "NOTICE"]
        rename "LICENSE.html", "license.html"
        rename "NOTICE", "notice.txt"
    }
    from("${liboExampleDocument}") {
        rename ".*", "example.odt"
    }
    into('program') {
        from "${liboInstdir}/program"
        includes = ['services.rdb', 'services/services.rdb']
    }
    into('share') {
        from "${liboInstdir}/share"
        // Filter data is needed by e.g. the drawingML preset shape import.
        includes = ['registry/**', 'filter/**', 'gallery/**', 'palette/**']
    }
}

tasks.register('createFullConfig', Copy) {
    description "copies various configuration bits into the apk"
    into(new File(assetsMain, 'share/config'))
    from("${liboInstdir}/share/config") {
        includes = ['soffice.cfg/**', 'images_colibre.zip']
    }
}

tasks.register('copyBrandTheme', Copy) {
    from "${liboBrandingDir}/online-theme"
    into new File(assetsMain, 'share/theme_definitions/online')
}

tasks.register('copyDocTemplates', Copy) {
    from "${rootProject.getRootDir()}/templates/untitled.odp",
            "${rootProject.getRootDir()}/templates/untitled.ods",
            "${rootProject.getRootDir()}/templates/untitled.odt"
    into new File(assetsMain, 'templates')
}

tasks.register('copyKitConfig', Copy) {
    from "${file(rootProject.getRootDir()).getParent()}/coolkitconfig-mobile.xcu"
    into new File(assetsMain, 'etc/coolwsd')
    rename { "coolkitconfig.xcu" }
}

tasks.register('createStrippedConfig') {
    def registryRes = new File(assetsMain, 'share/registry/res')
    def sofficeCfg = new File(assetsMain, 'share/config/soffice.cfg')
    def preserveDir = new File(sofficeCfg, 'empty')
    outputs.dir registryRes
    outputs.file preserveDir

    doLast {
        registryRes.mkdirs()
        sofficeCfg.mkdirs()
        // just empty file
        preserveDir.text = ""
    }
}

tasks.register('createRCfiles') {
    inputs.file "libSettings.gradle"
    dependsOn copyUnpackAssets, copyAssets
    def sofficerc = new File(assetsMain, 'unpack/program/sofficerc')
    def fundamentalrc = new File(assetsMain, 'program/fundamentalrc')
    def bootstraprc = new File(assetsMain, 'program/bootstraprc')
    def unorc = new File(assetsMain, 'program/unorc')
    def lounorc = new File(assetsMain, 'program/lounorc')
    def versionrc = new File(assetsMain, 'program/versionrc')

    outputs.files sofficerc, fundamentalrc, unorc, bootstraprc, versionrc

    doLast {
        sofficerc.text = '''\
[Bootstrap]
Logo=1
NativeProgress=1
URE_BOOTSTRAP=file:///assets/program/fundamentalrc
HOME=$APP_DATA_DIR/cache
OSL_SOCKET_PATH=$APP_DATA_DIR/cache
'''.stripIndent()

        fundamentalrc.text = '''\
[Bootstrap]
LO_LIB_DIR=file://$APP_DATA_DIR/lib/
BRAND_BASE_DIR=file:///assets
BRAND_SHARE_SUBDIR=share
URE_BIN_DIR=file:///assets/ure/bin/dir/nothing-here/we-can/exec-anyway
BAK_EXTENSIONS=${$ORIGIN/lounorc:TMP_EXTENSIONS}
BUNDLED_EXTENSIONS=${$ORIGIN/lounorc:BUNDLED_EXTENSIONS}
BUNDLED_EXTENSIONS_USER=${$ORIGIN/lounorc:BUNDLED_EXTENSIONS_USER}
SHARED_EXTENSIONS_USER=${$ORIGIN/lounorc:SHARED_EXTENSIONS_USER}
UNO_SHARED_PACKAGES_CACHE=${$ORIGIN/lounorc:UNO_SHARED_PACKAGES_CACHE}
TMP_EXTENSIONS=${$ORIGIN/lounorc:TMP_EXTENSIONS}
UNO_USER_PACKAGES_CACHE=${$ORIGIN/lounorc:UNO_USER_PACKAGES_CACHE}
'''.stripIndent()

        bootstraprc.text = '''\
[Bootstrap]
InstallMode=<installmode>
ProductKey=LibreOffice ''' + "${liboVersionMajor}.${liboVersionMinor}" + '''
UserInstallation=file://$APP_DATA_DIR
'''.stripIndent()

        unorc.text = '''\
[Bootstrap]
URE_INTERNAL_LIB_DIR=file://$APP_DATA_DIR/lib/
UNO_TYPES=file://$APP_DATA_DIR/program/udkapi.rdb file://$APP_DATA_DIR/program/offapi.rdb file://$APP_DATA_DIR/program/oovbaapi.rdb
UNO_SERVICES=file:///assets/program/services.rdb file:///assets/program/services/services.rdb
'''.stripIndent()

        lounorc.text = '''\
[Bootstrap]
PKG_BundledUnoFile=$BUNDLED_EXTENSIONS_USER/registry/com.sun.star.comp.deployment.component.PackageRegistryBackend/unorc
PKG_SharedUnoFile=$SHARED_EXTENSIONS_USER/registry/com.sun.star.comp.deployment.component.PackageRegistryBackend/unorc
PKG_UserUnoFile=$UNO_USER_PACKAGES_CACHE/registry/com.sun.star.comp.deployment.component.PackageRegistryBackend/unorc
BAK_EXTENSIONS=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/user/extensions/bak
BUNDLED_EXTENSIONS=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/share/extensions
BUNDLED_EXTENSIONS_USER=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/user/extensions/bundled
TMP_EXTENSIONS=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/user/extensions/tmp
SHARED_EXTENSIONS_USER=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/user/extensions/shared
UNO_SHARED_PACKAGES=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/share/uno_packages
UNO_SHARED_PACKAGES_CACHE=$UNO_SHARED_PACKAGES/cache
UNO_USER_PACKAGES=${$BRAND_BASE_DIR/program/bootstraprc:UserInstallation}/user/uno_packages
UNO_USER_PACKAGES_CACHE=$UNO_USER_PACKAGES/cache
'''.stripIndent()

        versionrc.text = '''\
[Version]
AllLanguages=en-US
BuildVersion=
buildid=''' + "${liboCoreVersionHash}" + '''
ReferenceOOoMajorMinor=4.1
'''.stripIndent()
    }
}

clean.doFirst {
	// The three in-tree roots are deleted unconditionally, even under
	// -PvulcanAssetsOut: a tree left behind by an earlier property-less build
	// is still an AGP asset source dir and would be packed into the AAR we
	// just promised carries no assets.
	//
	// A -PvulcanAssetsOut directory is deliberately NOT deleted here. It is a
	// path the CALLER owns and named on the command line, `clean` is a task
	// anyone may run for any reason, and `delete <that path>` on
	// `clean :lib:assembleRelease` is Gradle deciding to recursively remove a
	// directory outside the project on the strength of a property value. One
	// typo (`-PvulcanAssetsOut=$HOME`) and it is not a build failure. Whoever
	// owns the directory empties it; build-online-android.sh does exactly that
	// (`rm -rf "$assets_out"`) before it invokes Gradle at all.
	delete "src/main/assets"
	delete "src/debug/assets"
	delete "src/release/assets"
}

// creating the UI stuff is cheap, don't bother only applying it for the flavor..
preBuild.dependsOn 'createRCfiles',
        'createFullConfig',
        'copyBrandTheme'

tasks.register('generateCoolDebugAssets') {
    doLast {
        providers.exec {
            commandLine 'make', '-C', "${rootProject.layout.buildDirectory.get()}/../../browser", 'clean'
        }.result.get()
        providers.exec {
            commandLine 'make', '-C', "${rootProject.layout.buildDirectory.get()}/../../browser", "DIST_FOLDER=${new File(assetsDebug, 'dist')}", 'BUNDLE=DEBUG'
        }.result.get()
    }
}

tasks.register('generateCoolReleaseAssets') {
    doLast {
        providers.exec {
            commandLine 'make', '-C', "${rootProject.layout.buildDirectory.get()}/../../browser", 'clean'
        }.result.get()
        providers.exec {
            commandLine 'make', '-C', "${rootProject.layout.buildDirectory.get()}/../../browser", "DIST_FOLDER=${new File(assetsRelease, 'dist')}", 'BUNDLE=RELEASE'
        }.result.get()
    }
}

afterEvaluate {
	if (!file("${liboBrandingDir}").exists()) {
		copyBrandTheme.enabled = false
	}
	generateDebugAssets.dependsOn copyDocTemplates, copyKitConfig, generateCoolDebugAssets
	generateReleaseAssets.dependsOn copyDocTemplates, copyKitConfig, generateCoolReleaseAssets

	// AGP's own asset tasks, same ordering rule as the block at the end of this
	// file: these are what actually merge the asset roots, so `clean` running
	// alongside them is the same hazard.
	generateDebugAssets.mustRunAfter clean
	generateReleaseAssets.mustRunAfter clean

    // These tasks only exist under some cases (not in Android Studio)...
    // ...so use tasks.named so they don't fail if they are never registered...
    // ...also allows us to do the same thing for lots of tasks which are in the same case after the latest Android Gradle Plugin upgrade...
    tasks.named { it in [
        "generateDebugLintModel",
        "generateDebugLintReportModel",
        "generateDebugLintVitalModel",
        "generateReleaseLintModel",
        "generateReleaseLintVitalModel",
        "lintAnalyzeDebug",
        "lintVitalAnalyzeRelease",
    ] }.configureEach {
        dependsOn copyDocTemplates, copyKitConfig
    }
}

// `clean :lib:assembleRelease` in one invocation is what this pipeline runs, and
// Gradle gives the two no relative order by itself: the asset tasks are not
// `clean`'s dependencies, so it is free to run `clean` after they have populated
// the asset roots — deleting src/{main,debug,release}/assets out from under the
// build that just filled them. That is also why `clean` no longer deletes a
// -PvulcanAssetsOut directory: with no ordering, "clean removes the output" and
// "the build writes the output" were racing for the caller's directory.
//
// mustRunAfter and not dependsOn: the constraint applies only when both tasks are
// already in the same graph, so `assembleRelease` on its own does not start
// dragging `clean` in. At the END of the file because tasks.named() needs the
// tasks to be registered — generateCool{Debug,Release}Assets are declared above.
[
	'copyUnpackAssets',
	'copyAssets',
	'createFullConfig',
	'copyBrandTheme',
	'copyDocTemplates',
	'copyKitConfig',
	'createStrippedConfig',
	'createRCfiles',
	'generateCoolDebugAssets',
	'generateCoolReleaseAssets',
].each { name ->
	tasks.named(name).configure { mustRunAfter clean }
}
